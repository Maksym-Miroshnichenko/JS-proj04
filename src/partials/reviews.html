<section class="feedback-section" id="reviews">
  <div class="container">
    <h2 class="feedback-title">Відгуки клієнтів</h2>
    <p class="feedback-subtitle">
      Найкращі десерти, які я коли-небудь куштував!
    </p>

    <!-- Головний контейнер Swiper -->
    <div class="swiper feedback-swiper">
      <div class="swiper-wrapper" id="feedback-container">
        <!-- Картки відгуків додаються динамічно через JS -->
      </div>
    </div>

    <!-- Обгортка для елементів керування під слайдером (Пагінація + Стрілочки) -->
    <div class="controls-wrapper">
      <!-- Крапки пагінації (ліворуч) -->
      <div class="swiper-pagination feedback-pagination"></div>

      <!-- Кнопки навігації (праворуч) -->
      <div class="nav-buttons">
        <button class="swiper-btn swiper-btn-prev" aria-label="Назад"></button>
        <button class="swiper-btn swiper-btn-next" aria-label="Вперед"></button>
      </div>
    </div>
  </div>
</section>
